name: ci

# Four jobs, split by what they cost and what they prove:
#   unit      lint + tests on every supported interpreter -- must always pass
#   shell     shellcheck over the operator scripts -- cheap, catches typos that
#             would only surface at 03:00 on a login node
#   workflow  the Snakemake DAG builds for every shipped config
#   smoke     the real thing, end to end, against live HPRC/S3 data
#
# Only `smoke` is allowed to fail: it depends on network egress to
# raw.githubusercontent.com and s3-us-west-2.amazonaws.com, which forks and
# restricted runners do not necessarily have.  Nothing that tests the code
# itself is continue-on-error, because a test that cannot fail is not a test.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly, so that a change *upstream* -- a moved S3 object, a re-cut HPRC
    # data table -- surfaces here rather than in someone's cluster run.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  unit:
    name: unit (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The floor comes from requires-python; the ceiling from numba, which
        # is always the last dependency to support a new interpreter.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Tests
        # Network-marked tests are excluded here and run in the `smoke` job.
        run: pytest -m "not network" --cov=kmer_dust --cov-report=xml --cov-report=term-missing

      - name: Validate the shipped run configs
        # A config that no longer round-trips through Config.from_dict is a
        # broken deliverable even when every unit test passes.
        run: |
          python - <<'PY'
          from pathlib import Path
          from kmer_dust.config import Config
          for path in sorted(Path("workflow/config").glob("*.yaml")):
              cfg = Config.load(path)
              print(f"ok {path}: run_name={cfg.run_name} chroms={len(cfg.manifest.chroms)}")
          PY

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y shellcheck
      - name: Check scripts
        # The .sbatch files are bash despite the extension, hence the explicit
        # shell dialect.
        run: |
          shellcheck --shell=bash scripts/*.sh hpc/*.sh hpc/*.sbatch
      - name: Syntax-check with bash itself
        run: |
          for f in scripts/*.sh hpc/*.sh hpc/*.sbatch; do
            bash -n "$f" && echo "ok $f"
          done

  workflow:
    name: snakemake dag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[workflow]'
      - name: Dry-run every shipped config
        # Builds the DAG through the manifest checkpoint for each preset. This
        # is the gate; `snakemake --lint` is only a style opinion and is not
        # run here (it objects to helper functions living beside rules).
        run: |
          for cfg in workflow/config/*.yaml; do
            echo "::group::$cfg"
            snakemake --snakefile workflow/Snakefile --configfile "$cfg" \
                      --dry-run --quiet rules
            echo "::endgroup::"
          done

  smoke:
    name: real-data smoke
    # Scheduled, manual and post-merge only. Pull requests skip it: they cannot
    # reach the HPRC endpoints from a fork, and a 2-minute download on every
    # push would not earn its keep.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [unit, workflow]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The ONLY continue-on-error in this file. See the header.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # --only-binary pysam is load-bearing, not hygiene. A source build of
          # pysam links htslib WITHOUT libcurl, and an htslib without libcurl
          # cannot open https:// at all -- every remote assembly read then fails
          # instantly with a message naming only the URL. Fail at install time
          # instead.
          pip install --only-binary=pysam -e '.[dev,workflow]'

      - name: Record the environment
        # First thing to read when the smoke job misbehaves. `remote_https`
        # false here explains, on its own, a run that fetches nothing.
        run: |
          echo "::group::kmer-dust info"
          kmer-dust info | tee "$RUNNER_TEMP/kmer-dust-info.json"
          echo "::endgroup::"
          echo "::group::htslib build details"
          python -c "import pysam; print(pysam.samtools.version('--verbose'))"
          echo "::endgroup::"
          python - <<'PY'
          import json, os, sys
          info = json.load(open(os.environ["RUNNER_TEMP"] + "/kmer-dust-info.json"))
          if info.get("remote_https") is not True:
              print("::error title=htslib cannot open https::"
                    + str(info.get("remote_https_problem", info.get("remote_https"))))
              sys.exit(1)
          PY

      - name: Remote-access tests
        # Deliberately BEFORE the fixture step. These open one remote FASTA and
        # nothing else, so when the environment is the problem they fail in
        # seconds with a precise error, instead of the fetcher spending minutes
        # rejecting 40 haplotypes one at a time for the same underlying reason.
        env:
          KMER_DUST_TEST_NETWORK: "1"
        run: pytest -m network -v

      - name: Restore the test-data fixture
        id: fixture
        uses: actions/cache/restore@v4
        with:
          path: data/testdata
          # No restore-keys, on purpose. The key hashes the code that *produces*
          # the fixture, so a fallback would fire exactly when fetch.py changes
          # -- the case the key exists to catch -- and hand the new code a
          # fixture built by the old code, with a matching .fetch_params stamp
          # that makes the fetcher skip entirely. A broken fetcher would go
          # green on stale bytes.
          key: kmer-dust-testdata-v1-${{ hashFiles('scripts/fetch_test_data.sh', 'src/kmer_dust/fetch.py', 'src/kmer_dust/catalog/*.py') }}

      - name: Restore the upstream download cache
        # Separate step because this one MAY use a loose key: it holds nothing
        # but content-addressed upstream downloads, re-validated on read.
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: kmer-dust-downloads-v1-${{ hashFiles('src/kmer_dust/catalog/*.py') }}
          restore-keys: |
            kmer-dust-downloads-v1-

      - name: Fetch the fixture
        env:
          KMER_DUST_LOGLEVEL: DEBUG
        run: scripts/fetch_test_data.sh

      - name: Smoke test (kmer-dust run)
        run: scripts/smoke.sh --skip-fetch --force

      - name: Smoke test (snakemake DAG)
        run: scripts/smoke.sh --skip-fetch --snakemake --cores 2 --force

      - name: Save the test-data fixture
        # Only a fixture that survived both smoke runs is worth keeping, and
        # `success()` means a zero-assembly fixture can never be cached: the
        # verifier in fetch_test_data.sh already exits 1 on an empty manifest.
        if: success() && steps.fixture.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/testdata
          key: kmer-dust-testdata-v1-${{ hashFiles('scripts/fetch_test_data.sh', 'src/kmer_dust/fetch.py', 'src/kmer_dust/catalog/*.py') }}

      - name: Save the upstream download cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: kmer-dust-downloads-v1-${{ hashFiles('src/kmer_dust/catalog/*.py') }}

      - name: Explain a failure
        # The job is continue-on-error, so without this the run is green and
        # nothing says otherwise. An ::error:: annotation shows up on the run
        # summary page even when the job is allowed to fail.
        if: failure()
        run: |
          echo "::error title=smoke job failed::real-data smoke test failed; see the 'Record the environment' and 'Fetch the fixture' steps"
          {
            echo "## real-data smoke failed"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/kmer-dust-info.json" 2>/dev/null || echo '(kmer-dust info never ran)'
            echo '```'
            echo
            echo "Fixture manifest:"
            echo '```'
            cat data/testdata/manifest.tsv 2>/dev/null || echo '(no manifest written)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            results/smoke/report/
            results/smoke/logs/
            data/testdata/manifest.tsv
            data/testdata/.fetch_params
          if-no-files-found: warn
